
name: Build Thapad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix JVM compatibility
        run: |
          python3 - <<'PY'
          import os
          import re

          root = os.environ["GITHUB_WORKSPACE"]
          for base, dirs, files in os.walk(root + "/extracted"):
              for name in files:
                  if name.endswith((".gradle", ".gradle.kts")):
                      path = os.path.join(base, name)
                      with open(path, encoding="utf-8") as f:
                          content = f.read()
                      content = content.replace(
                          "JavaVersion.VERSION_1_8",
                          "JavaVersion.VERSION_17"
                      )
                      content = re.sub(
                          r"(jvmTarget\s*=\s*)['\"]1\.8['\"]",
                          r"\1'17'",
                          content
                      )
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          PY

            -       - name: Build APK
        run: |
          cat > "$GITHUB_WORKSPACE/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF

          cd "$PROJECT_DIR"
          gradle -I "$GITHUB_WORKSPACE/force-jvm.gradle" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thapad-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
